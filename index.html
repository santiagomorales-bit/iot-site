<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My IoT Page</title>
<style>
  /* ---------- YOU CAN CHANGE ALL OF THIS ---------- */
  body { 
    font-family: Arial, sans-serif; 
    max-width: 640px; 
    margin: 24px auto; 
    padding: 0 16px; 
    color: #fff; /* Changed text color to white for contrast against the image */
    
    /* Lamine Yamal Background Configuration */
    background-image: url('https://unsplash.com'); /* High-quality stadium/football placeholder - replace with a direct URL of Lamine Yamal if desired */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  
  /* Semi-transparent dark overlay to keep the text perfectly readable over the image */
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: -1;
  }

  h1   { margin-bottom: 4px; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
  p.small { text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
  p.small a { color: #36c; font-weight: bold; text-decoration: none; }
  
  /* Cards adjusted with a slight transparent dark backdrop for a modern glassmorphism feel */
  .card { background: rgba(34, 34, 34, 0.85); border-radius: 12px; padding: 20px; margin: 16px 0; box-shadow: 0 4px 15px rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,0.1); }
  .status { font-size: 1.6rem; font-weight: bold; margin: 8px 0; }
  .small { color: #ccc; font-size: .9rem; }
  
  button { font-size: 1rem; padding: 10px 18px; margin: 4px; border: 0; border-radius: 8px; cursor: pointer; color: #fff; font-weight: bold; transition: opacity 0.2s; }
  button:hover { opacity: 0.9; }
  
  .red   { background: #d33; }
  .green { background: #2a2; }
  .blue  { background: #36c; }
  .orange { background: #e67e22; }
  .off   { background: #555; }
  .flash { animation: flash .6s; }
  @keyframes flash { from { background: #ffe66d; color: #222; } to { background: rgba(34, 34, 34, 0.85); color: #fff; } }
  #errors { color: #ff6b6b; white-space: pre-wrap; }
</style>
</head>
<body>

<h1>My IoT Page</h1>
<p class="small">Adafruit IO user: <span id="whoami">?</span> &nbsp;|&nbsp; <a href="#" id="changeKey">change key</a></p>

<!-- ================= PROJECT A : Arduino -> Website ================= -->
<div class="card" id="cardA">
  <h2>Doorbell</h2>
  <div class="status" id="doorbellStatus">Waiting for the Arduino...</div>
  <div class="small" id="doorbellTime"></div>
  <div class="small">Presses since this page opened: <span id="doorbellCount">0</span></div>
</div>

<!-- ================= PROJECT B : Website -> Arduino ================= -->
<div class="card">
  <h2>Remote Lamp</h2>
  <button class="red"     onclick="sendLamp('red')">Red</button>
  <button class="green"   onclick="sendLamp('green')">Green</button>
  <button class="blue"    onclick="sendLamp('blue')">Blue</button>
  <button class="orange"  onclick="sendLamp('buzzer')">Buzzer</button>
  <button class="off"     onclick="sendLamp('off')">Off</button>
  <div class="small" id="lampStatus"></div>
</div>

<div class="card">
  <h3>Problems?</h3>
  <div id="errors" class="small">None yet.</div>
</div>

<script>
/* =====================================================================
   SETTINGS - change these two lines
   ===================================================================== */
const IO_USERNAME   = "lamine_10";   // <-- your Adafruit IO username
const DOORBELL_FEED = "doorbell";                     // Project A feed (Arduino -> web)
const LAMP_FEED     = "lamp";                         // Project B feed (web -> Arduino)
const POLL_MS       = 2000;                           // how often to check the doorbell feed (ms). Keep >= 2000.

/* =====================================================================
   YOUR KEY IS NOT IN THIS FILE ON PURPOSE.
   This page is public on GitHub. Anyone can read this code. So the page
   asks you for your key once and remembers it in THIS browser only.
   ===================================================================== */
function getKey() {
  let key = null;
  try { key = localStorage.getItem("aio_key"); } catch (e) {}
  if (!key) {
    key = prompt("Paste your Adafruit IO key (starts with aio_). It stays in this browser only.");
    if (key) { try { localStorage.setItem("aio_key", key.trim()); } catch (e) {} }
  }
  return key ? key.trim() : "";
}
document.getElementById("changeKey").onclick = (e) => {
  e.preventDefault();
  try { localStorage.removeItem("aio_key"); } catch (e2) {}
  location.reload();
};

const IO_KEY = getKey();
document.getElementById("whoami").textContent = IO_USERNAME;

const BASE = `https://adafruit.com{IO_USERNAME}/feeds/`;

function showError(msg) {
  document.getElementById("errors").textContent = msg;
  console.error(msg);
}

/* =====================================================================
   PROJECT A - read the doorbell feed every POLL_MS milliseconds
   ===================================================================== */
let lastSeenId = null;   // id of the newest data point we have already shown
let count = 0;

async function checkDoorbell() {
  try {
    const res = await fetch(BASE + DOORBELL_FEED + "/data/last", {
      headers: { "X-AIO-Key": IO_KEY }
    });
    if (res.status === 404) { showError("Feed '" + DOORBELL_FEED + "' not found. Did you create it on ://adafruit.com?"); return; }
    if (res.status === 401) { showError("401: wrong username or key. Click 'change key'."); return; }
    if (!res.ok) { showError("Adafruit IO replied " + res.status); return; }

    const data = await res.json();       // { id, value, created_at, ... }

    if (data.id !== lastSeenId) {        // something NEW happened on the Arduino
      const isFirstLoad = (lastSeenId === null);
      lastSeenId = data.id;
      if (!isFirstLoad) count++;
      showDoorbell(data.value, data.created_at, !isFirstLoad);
    }
    document.getElementById("errors").textContent = "None. Connected.";
  } catch (err) {
    showError("Could not reach Adafruit IO: " + err.message);
  }
}

function showDoorbell(value, createdAt, flash) {
  let message = "Button " + value + " was pressed";

  document.getElementById("doorbellStatus").textContent = message;
  document.getElementById("doorbellTime").textContent = "at " + new Date(createdAt).toLocaleTimeString();
  document.getElementById("doorbellCount").textContent = count;

  if (flash) {
    const card = document.getElementById("cardA");
    card.classList.remove("flash");
    void card.offsetWidth;               // restart the animation
    card.classList.add("flash");
  }
}

/* =====================================================================
   PROJECT B - write to the lamp feed when a button is clicked
   ===================================================================== */
async function sendLamp(value) {
  const status = document.getElementById("lampStatus");
  status.textContent = "Sending '" + value + "'...";
  try {
    const res = await fetch(BASE + LAMP_FEED + "/data", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-AIO-Key": IO_KEY },
      body: JSON.stringify({ value: value })
    });
    if (res.status === 429) { status.textContent = "Slow down! Rate limit hit (30 per minute)."; return; }
    if (!res.ok) { status.textContent = "Adafruit IO replied " + res.status; return; }
    status.textContent = "Sent '" + value + "' at " + new Date().toLocaleTimeString();
  } catch (err) {
    status.textContent = "Could not send: " + err.message;
  }
}

/* ---------- start ---------- */
checkDoorbell();
setInterval(checkDoorbell, POLL_MS);
</script>
</body>
</html>
